name: Bug report
description: Something in Skywrite does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead? Include the steps if you can.
      placeholder: |
        1. Press ⌃⌥N
        2. Click on the screen and type a note
        3. ...
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: macOS 26.1
  - type: input
    id: skywrite-version
    attributes:
      label: Skywrite version
      description: Skywrite menu → About Skywrite, or the commit you built from.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots, screen recording or logs
      description: Optional. Drag files here. To export logs, open Settings › Troubleshooting and click Export Logs…. They never include what you wrote in your notes.

name: Bug report
description: Something in Skywrite does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press the right Option key twice
        2. Click on the screen and type a note
        3. ...
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      description: Apple menu → About This Mac.
      placeholder: macOS 26.1
    validations:
      required: true
  - type: input
    id: skywrite-version
    attributes:
      label: Skywrite version
      description: Skywrite menu → About Skywrite, or the commit you built from.
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: Optional. Drag files here.
